name: Pilot-EU-Multimarket-Test

# Manual, on-demand test runner for pilot/eu_multimarket/ (see its
# README). GitHub's hosted runners have normal, unrestricted internet
# access unlike some sandboxed dev environments, which makes this useful
# for verifying scraping/parsing logic changes against real Amazon pages
# without needing anyone's own machine or VPS.
#
# Deliberately NOT on a schedule, NOT wired into any cron, and does NOT
# commit anything back to the repo — this is a throwaway verification
# run only. ASINs come from the workflow_dispatch input, not from a
# committed whitelist.txt (pilot state is gitignored and not present in
# a fresh checkout).

on:
  workflow_dispatch:
    inputs:
      asins:
        description: "Comma-separated ASINs to check, e.g. B0G4NF8QDZ,B0G4NDFS5R"
        required: true
      markets:
        description: "Space-separated market codes (see pilot/eu_multimarket/marketplaces.py)"
        required: false
        default: "se de fr es"
      delivery_country:
        description: "Delivery destination country. Pinned on every market so their dates are comparable — leave as Sweden unless testing."
        required: false
        default: "Sweden"
      delivery_postcode:
        description: "Postcode used when the destination country IS the marketplace's own country"
        required: false
        default: "11164"
      send_discord:
        description: "Actually post to Discord instead of just logging (uses the same repo secrets as production)"
        required: false
        default: false
        type: boolean
      debug:
        description: "Verbose page diagnostics for EVERY product (selector-by-selector presence, page language, date-like strings, delivery wording). Leave on — UNKNOWN results always log this, but debug also logs the products that DID resolve, which is what you compare against."
        required: false
        default: true
        type: boolean

permissions:
  contents: read  # read-only — this workflow never commits anything back

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pilot/eu_multimarket/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pilot/eu_multimarket/requirements.txt

      - name: Install Playwright's Chromium and its OS dependencies
        run: python -m playwright install --with-deps chromium

      - name: Seed whitelist.txt from workflow input
        run: |
          mkdir -p pilot/eu_multimarket/state
          echo "${{ inputs.asins }}" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$' > pilot/eu_multimarket/state/whitelist.txt
          echo "Whitelist for this run:"
          cat pilot/eu_multimarket/state/whitelist.txt

      - name: Run track_delivery_multi.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DEBUG: ${{ inputs.debug }}
          DELIVERY_COUNTRY: ${{ inputs.delivery_country }}
          DELIVERY_POSTCODE: ${{ inputs.delivery_postcode }}
        run: |
          python pilot/eu_multimarket/track_delivery_multi.py ${{ inputs.markets }} \
            ${{ inputs.send_discord == 'true' && '--send-discord' || '' }}

      # The job log is the reliable channel for getting results out of
      # this workflow: the artifact below is hosted on Azure Blob
      # Storage, which the restrictive proxies used by sandboxed dev
      # environments tend to block, so it often can't be fetched
      # programmatically. Echo the small, high-value files into the log
      # so a run is fully diagnosable from `gh run view --log` alone.
      - name: Echo resulting state into the log
        if: always()
        run: |
          echo "::group::state/ tree"
          find pilot/eu_multimarket/state -type f -printf '%10s  %p\n' | sort -k2 || true
          echo "::endgroup::"

          for f in pilot/eu_multimarket/state/*/delivery_state.json; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

          # Not the debug HTML itself — an Amazon product page is ~2 MB
          # of markup and unreadable in a log. The scraper already
          # summarises each one (page language, selector presence,
          # date-like strings, delivery wording) into the log at the
          # point it gives up; this is just the index of what got saved.
          echo "::group::debug HTML dumps saved (contents summarised inline in the run log above)"
          ls -la pilot/eu_multimarket/state/*/debug_*.html 2>/dev/null || echo "none — nothing came back UNKNOWN"
          echo "::endgroup::"

      - name: Upload state (debug HTML, delivery_state.json) as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-eu-multimarket-state
          path: |
            pilot/eu_multimarket/state/
            pilot/eu_multimarket/logs/
          retention-days: 7
