# Install with: sudo cp deploy/logrotate.conf /etc/logrotate.d/news-notifier
# then edit the path below if your clone isn't at ~/news-notifier.
# logrotate itself runs daily via cron/systemd-timer on Ubuntu already —
# no extra scheduling needed once this file is in place.
/home/*/news-notifier/logs/*.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
}
